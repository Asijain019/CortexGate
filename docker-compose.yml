services:
  redis:
    image: redis:7
    container_name: cortexgate_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # Local LLM provider (free, no API key). Pull a model once:
  #   docker exec cortexgate_ollama ollama pull qwen2.5:0.5b
  ollama:
    image: ollama/ollama:latest
    container_name: cortexgate_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  redis_data:
  ollama_data:
